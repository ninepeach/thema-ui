{{/* components/form/button — dot: ui.Button. URL → <a>, else <button>.
     Dialog opens a dialog by id; Close closes the enclosing dialog. */}}
{{ define "components/form/button" }}{{ if .URL }}<a class="ui-button ui-button--{{ or .Variant "secondary" }}{{ if .Block }} ui-button--block{{ end }}" href="{{ .URL }}"{{ if .Disable }} aria-disabled="true" tabindex="-1"{{ end }}>{{ template "components/form/button-inner" . }}</a>{{ else }}<button class="ui-button ui-button--{{ or .Variant "secondary" }}{{ if .Block }} ui-button--block{{ end }}" type="{{ if .Close }}submit{{ else }}{{ or .Type "button" }}{{ end }}"{{ with .Name }} name="{{ . }}"{{ end }}{{ if .Close }} value="cancel" formnovalidate{{ else }}{{ with .Value }} value="{{ . }}"{{ end }}{{ end }}{{ with .Dialog }} data-dialog-open="{{ . }}" aria-haspopup="dialog"{{ end }}{{ if .Disable }} disabled{{ end }}>{{ template "components/form/button-inner" . }}</button>{{ end }}{{ end }}
{{ define "components/form/button-inner" }}{{ with .Icon }}<span class="ui-button__icon">{{ template "icon" . }}</span>{{ end }}<span class="ui-button__label">{{ template "text" .Label }}</span><span class="ui-button__spinner" aria-hidden="true"></span>{{ end }}
